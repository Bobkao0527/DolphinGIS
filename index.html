<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 伺服器地圖 - DolphinGIS</title>
    <!-- 外部樣式庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 專案樣式 -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- UI 控制面板 -->
    <div class="control-panel">
        <div class="info-box">
            <h2 class="brand-title">DolphinGIS Map</h2>
            <div class="sub-title">Minecraft Server Navigation System</div>
            <div id="loading-indicator">正在同步建物資料庫...</div>
            
            <!-- SSO 驗證區塊 (載入狀態/登入/登出) -->
            <div class="auth-section" id="auth-section">
                <div id="auth-loading" style="font-size: 11px; color: var(--player-accent);">正在確認登入狀態...</div>
                
                <div id="auth-guest" style="display: none;">
                    <span style="font-size: 10px; opacity: 0.6; display: block; margin-bottom: 4px;">部分傳送功能需要驗證身份</span>
                    <button id="login-btn" class="login-btn">
                        <img src="https://minotar.net/avatar/char/16" style="width: 16px; height: 16px; border-radius: 2px;" alt="">
                        Minecraft 統一登入
                    </button>
                </div>
                
                <div id="auth-user" style="display: none;">
                    <div class="user-profile">
                        <img id="user-avatar" class="player-avatar" src="" style="width: 28px; height: 28px;" alt="Avatar">
                        <div class="user-info-text">
                            <span id="user-name" style="font-size: 12px; font-weight: bold; color: var(--accent);">未知玩家</span>
                            <span class="user-status-badge">傳送特權解鎖</span>
                        </div>
                    </div>
                    <button id="logout-btn" class="logout-btn" style="margin-top: 8px;">安全登出</button>
                </div>
            </div>
        </div>

        <!-- 多維度切換下拉選單 -->
        <div class="dimension-selector">
            <span class="dimension-label">當前維度 / Dimension</span>
            <select id="dimension-select" class="dimension-select">
                <option value="overworld">主世界 (Overworld)</option>
                <option value="the_nether">地獄 (The Nether)</option>
                <option value="the_end">終界 (The End)</option>
                <option value="giant">巨人 (Giant)</option>
                <option value="mini">縮微 (Mini)</option>
                <option value="space">太空 (Space)</option>
                <option value="survival">生存 (Survival)</option>
            </select>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" 
                       placeholder="搜尋名稱、地址或 ID" 
                       autocomplete="off">
                <button id="search-btn" class="search-btn">搜尋</button>
            </div>
            <div id="results-list" class="results-list"></div>
        </div>

    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>
    
    <!-- 座標顯示與當前維度 -->
    <div class="coord-display" id="coords">
        <span class="dim-display" id="current-dim-text">DIMENSION: OVERWORLD</span>
        <span>X: 0, Z: 0</span>
    </div>

    <!-- 在線玩家選單 -->
    <div class="player-menu-container">
        <button id="player-menu-toggle" class="player-menu-toggle">在線玩家 (0)</button>
        <div id="player-menu-panel" class="player-menu-panel" style="display: none;">
            <div class="player-menu-header">在線玩家</div>
            <div id="player-menu-list" class="player-menu-list"></div>
        </div>
    </div>

    <!-- 腳本引用 (注意載入順序：驗證核心 -> 傳送控制 -> 地圖邏輯) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/login.js"></script>
    <script src="js/teleport.js"></script>
    <script src="js/map-logic.js"></script>
    <script src="js/search-logic.js"></script>
    <script src="js/tracker-logic.js"></script>
</body>
</html>
