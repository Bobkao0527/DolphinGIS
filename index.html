<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 伺服器地圖 - DolphinGIS</title>
    <!-- 外部樣式庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 專案樣式 -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- UI 控制面板 -->
    <div class="control-panel">
        <div class="info-box">
            <h2 class="brand-title">DolphinGIS Map</h2>
            <div class="sub-title">Minecraft Server Navigation System</div>
            <div id="loading-indicator">正在同步建物資料庫...</div>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" 
                       placeholder="搜尋名稱、地址或 ID" 
                       autocomplete="off">
                <button id="search-btn" class="search-btn">搜尋</button>
            </div>
            <div id="results-list" class="results-list"></div>
        </div>
    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>
    
    <!-- 座標顯示 -->
    <div class="coord-display" id="coords">X: 0, Z: 0</div>

    <!-- 腳本引用 (注意順序) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map-logic.js"></script>
    <script src="js/search-logic.js"></script>
    <script src="js/tracker-logic.js"></script>
</body>
</html>
